{% comment %}
Params: label, field, filter_urls, active_filters, current_sort, current_dir, q, date_from, date_to, filter_type (optional)
{% endcomment %}
{% load coal_tags %}
<th class="text-left px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wide" data-field="{{ field }}">
    <div class="flex items-start gap-1">
        <a href="{% if current_sort == field and current_dir == 'asc' %}{% querystring sort=field dir='desc' page=None %}{% else %}{% querystring sort=field dir='asc' page=None %}{% endif %}"
           class="inline-flex items-start gap-1 hover:text-slate-700 dark:hover:text-slate-200 transition-colors min-w-0">
            <span class="inline-block max-w-[6rem] whitespace-normal leading-tight">{{ label }}</span>
            {% if current_sort == field %}
                {% if current_dir == 'asc' %}
                <svg class="w-3 h-3 mt-0.5 text-brand-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7"/></svg>
                {% else %}
                <svg class="w-3 h-3 mt-0.5 text-brand-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
                {% endif %}
            {% else %}
            <svg class="w-3 h-3 mt-0.5 opacity-30 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
            {% endif %}
        </a>
        <button type="button"
                class="col-filter-btn mt-0.5 p-0.5 rounded hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors shrink-0 {% if field|key_in_dict:active_filters or field|key_in_dict:active_range_filters or field|key_in_dict:active_text_filters %}text-brand-500{% else %}text-slate-400 dark:text-slate-500{% endif %}"
                data-filter-field="{{ field }}"
                data-filter-type="{{ filter_type|default:'value' }}"
                data-filter-url="{{ filter_urls|dict_get:field }}"
                data-filter-checked="{% with active=active_filters|dict_get:field %}{% for v in active %}{{ v }}{% if not forloop.last %}|||{% endif %}{% endfor %}{% endwith %}"
                data-filter-text="{{ active_text_filters|dict_get:field|default:'' }}"
                data-filter-from="{{ active_range_filters|dict_get:field|dict_get:'from'|default:'' }}"
                data-filter-to="{{ active_range_filters|dict_get:field|dict_get:'to'|default:'' }}"
                title="Фильтр: {{ label }}">
            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2a1 1 0 01-.293.707L13 13.414V19a1 1 0 01-.553.894l-4 2A1 1 0 017 21v-7.586L3.293 6.707A1 1 0 013 6V4z"/>
            </svg>
        </button>
    </div>
</th>
