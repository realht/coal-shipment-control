{% extends "base.html" %}

{% block title %}Вход — Учёт отгрузок угля{% endblock %}

{% block content_anon %}
<div class="w-full max-w-sm">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl px-8 py-10">
        <div class="flex flex-col items-center mb-8">
            <span class="text-5xl mb-3">⛏</span>
            <h1 class="text-xl font-bold text-slate-800 dark:text-slate-100">Учёт отгрузок угля</h1>
            <p class="text-sm text-slate-400 mt-1">Войдите в систему</p>
        </div>

        {% if form.non_field_errors %}
        <div class="mb-4 px-4 py-3 rounded-lg bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-700 text-red-700 dark:text-red-300 text-sm">
            {% for error in form.non_field_errors %}{{ error }}{% endfor %}
        </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-1">
                    Логин
                </label>
                <input type="text" name="username" value="{{ form.username.value|default:'' }}" autocomplete="username" required
                       class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 dark:focus:ring-brand-500 focus:border-transparent transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-1">
                    Пароль
                </label>
                <input type="password" name="password" autocomplete="current-password" required
                       class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 dark:focus:ring-brand-500 focus:border-transparent transition">
            </div>
            <button type="submit"
                    class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white font-semibold rounded-lg text-sm transition-colors duration-150 mt-2">
                Войти
            </button>
        </form>

        <div class="mt-6 flex justify-center">
            <button data-theme-toggle
                    class="flex items-center gap-1.5 text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                <span class="dark:hidden">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                </span>
                <span class="hidden dark:inline">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                </span>
                <span class="dark:hidden">Тёмная тема</span>
                <span class="hidden dark:inline">Светлая тема</span>
            </button>
        </div>
    </div>
</div>
{% endblock %}
